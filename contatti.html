<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0B0D10;
  --bg-2:   #0E1116;
  --ink:    #E6E8EB;
  --grey:   #6B7280;
  --signal: #E8C98F;
  --line:   rgba(230,232,235,0.09);
  --font:   'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
}

html { background: var(--bg); }
body {
  background: radial-gradient(120% 80% at 50% 30%, var(--bg-2) 0%, var(--bg) 70%);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 300;
  min-height: 100vh;
  line-height: 1.75;
}
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 1px solid var(--signal); outline-offset: 4px;
}

/* a calm strip of sea at the bottom */
#sea { position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; z-index: 0; pointer-events: none; }

.wrap {
  position: relative;
  z-index: 1;
  max-width: 660px;
  margin: 0 auto;
  padding: 4.5rem 1.75rem 34vh;
}

.back {
  display: inline-flex; align-items: center; gap: 0.55rem;
  font-size: 0.86rem; color: var(--grey); text-decoration: none;
  margin-bottom: 3rem;
  transition: color .2s, gap .25s;
}
.back:hover { color: var(--signal); gap: 0.9rem; }

h1 {
  font-weight: 500;
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  line-height: 1.15;
  letter-spacing: 0.01em;
}
.updated { margin-top: 0.5rem; font-size: 0.82rem; color: var(--grey); }
.rule { width: 48px; height: 1px; background: var(--signal); opacity: 0.8; margin: 1.5rem 0 2.2rem; }

h2 { font-weight: 500; font-size: 1.15rem; margin: 2.4rem 0 0.6rem; color: var(--ink); }
p { font-size: 0.95rem; color: rgba(230,232,235,0.82); }
p + p { margin-top: 0.9rem; }
.muted { color: var(--grey); font-size: 0.88rem; }
ul { padding-left: 1.2rem; margin: 0.6rem 0; }
li { font-size: 0.95rem; color: rgba(230,232,235,0.82); margin: 0.3rem 0; }
strong { font-weight: 500; color: var(--ink); }
a.inline { color: var(--signal); text-decoration: none; border-bottom: 1px solid rgba(232,201,143,0.35); }
a.inline:hover { color: var(--ink); border-color: var(--ink); }

table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.4rem; font-size: 0.9rem; }
th, td { text-align: left; padding: 0.7rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 400; color: var(--grey); font-size: 0.78rem; }
td { color: rgba(230,232,235,0.85); }

footer {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 1; text-align: center;
  padding: 1.3rem; font-size: 0.78rem; color: var(--grey);
}
footer a { color: var(--grey); text-decoration: none; }
footer a:hover { color: var(--signal); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.wrap { animation: fadeUp .8s ease both; }
@media (prefers-reduced-motion: reduce) { .wrap { animation: none; } }

@media (max-width: 560px) {
  .wrap { padding: 3.2rem 1.4rem 36vh; }
  th, td { padding: 0.6rem 0.4rem; }
}

.intro { font-size: 1rem; color: var(--grey); line-height: 1.7; margin-bottom: 2.6rem; max-width: 480px; }
form { display: flex; flex-direction: column; gap: 1.8rem; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.field { display: flex; flex-direction: column; gap: 0.45rem; }
label { font-size: 0.8rem; color: var(--grey); }
input, textarea {
  background: transparent; border: none; border-bottom: 1px solid var(--line);
  color: var(--ink); font-family: var(--font); font-weight: 300; font-size: 1.02rem;
  padding: 0.45rem 2px 0.6rem; outline: none; border-radius: 0; transition: border-color .3s;
}
textarea { resize: vertical; min-height: 130px; line-height: 1.6; }
input:focus, textarea:focus { border-bottom-color: var(--signal); }
button[type="submit"] {
  align-self: flex-start; margin-top: 0.4rem;
  font-family: var(--font); font-weight: 400; font-size: 0.86rem;
  padding: 0.8rem 2rem; border-radius: 4px;
  border: 1px solid var(--signal); background: transparent; color: var(--signal);
  cursor: pointer; transition: background .25s, color .25s;
}
button[type="submit"]:hover { background: var(--signal); color: var(--bg); }
#form-status { font-size: 0.95rem; min-height: 1.4em; }
#form-status.ok  { color: var(--signal); }
#form-status.err { color: #E07A6E; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 1.8rem; } button[type="submit"] { align-self: stretch; } }
</style>

<body>

<div class="wrap">
  <a class="back" href="/">&larr; Torna alla home</a>

  <h1>Contattami</h1>
  <div class="rule"></div>
  <p class="intro">Scrivimi pure: che sia per un progetto, una domanda o solo per scambiare due parole, questo è il posto giusto.</p>

  <form id="contact-form" action="https://formspree.io/f/mdaqwjwz" method="POST">
    <div class="row">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="cognome">Cognome</label>
        <input type="text" id="cognome" name="cognome" autocomplete="family-name" required>
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="messaggio">Messaggio</label>
      <textarea id="messaggio" name="messaggio" required></textarea>
    </div>
    <input type="hidden" name="_subject" value="Nuovo messaggio da gioriva.it">
    <p id="form-status" aria-live="polite"></p>
    <button type="submit">Invia il messaggio</button>
  </form>
</div>

<footer>
  &copy; 2026 Giorgio Riva &nbsp;<a href="/">gioriva.it</a>
</footer>
<canvas id="sea"></canvas>

<script>
'use strict';
/* a calm strip of sea, no lights: continuity with the home */
(function () {
  var cv = document.getElementById('sea'), ctx = cv.getContext('2d');
  var W, H, dpr, lines = [], N = 6;
  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = Math.round(window.innerHeight * 0.30);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lines = [];
    for (var i = 0; i < N; i++) {
      var d = i / (N - 1);
      lines.push({ d: d, y: H * (0.15 + Math.pow(d, 1.6) * 0.75), amp: 1.5 + 10 * Math.pow(d, 1.7),
        alpha: 0.06 + 0.16 * d, ph: i * 1.93,
        k1: 2 * Math.PI / (W * (0.26 + 0.44 * d)), k2: 2 * Math.PI / (W * (0.11 + 0.16 * d)),
        s1: 0.22 + 0.30 * d, s2: 0.18 + 0.20 * d });
    }
  }
  layout(); window.addEventListener('resize', layout);
  var t0 = null;
  function frame(ts) {
    if (t0 === null) t0 = ts;
    var t = (ts - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = 'round';
    for (var i = 0; i < N; i++) {
      var L = lines[i], g = 0.78 + 0.22 * Math.sin(t * 0.11 + L.ph * 0.5);
      ctx.beginPath();
      for (var x = -8; x <= W + 8; x += 4) {
        var y = L.y + L.amp * g * (Math.sin(x * L.k1 + t * L.s1 + L.ph) + 0.5 * Math.sin(x * L.k2 - t * L.s2 + L.ph * 1.7));
        if (x === -8) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.lineWidth = 0.7 + 0.5 * L.d;
      ctx.strokeStyle = 'rgba(230,232,235,' + L.alpha.toFixed(3) + ')';
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
