<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0E0E0E;
  --surface: #151515;
  --line:    rgba(255,255,255,0.07);
  --text:    #E8E2D9;
  --muted:   #6B6560;
  --gold:    #C8A97E;
  --serif:  'Cormorant Garamond', Georgia, serif;
  --sans:   'Montserrat', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 300;
  height: 100vh;
  overflow: hidden;
  cursor: none;
}
a { cursor: none; }

/* ── Starfield canvas ── */
#stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── Layout ── */
.hero {
  position: relative;
  z-index: 2;
  height: calc(100vh - 60px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 0 3.5rem;
  gap: 4rem;
}

.hero-left { display: flex; flex-direction: column; gap: 1.6rem; }

.hero-name {
  font-family: var(--serif);
  font-size: clamp(4rem, 7.5vw, 8.5rem);
  font-weight: 300;
  line-height: 0.95;
  color: var(--text);
}
.hero-name em { font-style: italic; color: var(--gold); }

.hero-rule { width: 36px; height: 1px; background: var(--gold); opacity: 0.6; }

.hero-tagline {
  font-family: var(--serif);
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  font-style: italic;
  color: var(--muted);
  line-height: 1.6;
  max-width: 340px;
}

.hero-coords {
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.7;
}

.hero-right { display: flex; align-items: center; justify-content: center; }

#globe-wrap {
  position: relative;
  width: min(48vw, 560px);
  height: min(48vw, 560px);
  will-change: transform;
}
#globe-wrap svg { width: 100%; height: 100%; display: block; }
#city-overlay { position: absolute; inset: 0; pointer-events: none; }

/* ── Footer ── */
footer {
  position: relative;
  z-index: 2;
  height: 60px;
  border-top: 1px solid var(--line);
  padding: 0 3.5rem;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.footer-links { display: flex; gap: 2.5rem; list-style: none; }
.footer-links a {
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  transition: color .2s;
}
.footer-links a:hover { color: var(--gold); }

/* ── Custom cursor ── */
#cur-dot {
  position: fixed; top: 0; left: 0;
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  transition: width .2s, height .2s, background .2s;
}
#cur-ring {
  position: fixed; top: 0; left: 0;
  width: 32px; height: 32px;
  border: 1px solid rgba(200,169,126,0.55);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%,-50%);
  transition: width .25s, height .25s, border-color .25s;
}
body.hov #cur-dot  { width: 10px; height: 10px; background: #fff; }
body.hov #cur-ring { width: 48px; height: 48px; border-color: rgba(200,169,126,0.9); }

/* ── Drone ── */
#drone {
  position: fixed;
  z-index: 5;
  opacity: 0;
  transition: opacity 1.5s ease;
  pointer-events: auto;
  cursor: none;
}
#drone.visible { opacity: 1; }
#drone svg { display: block; }
#drone:hover svg { filter: brightness(1.45); }
#drone a { display: block; }

/* ── Entry animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hero-name    { animation: fadeUp .7s ease both .25s; }
.hero-rule    { animation: fadeUp .5s ease both .45s; }
.hero-tagline { animation: fadeUp .7s ease both .55s; }
.hero-coords  { animation: fadeUp .7s ease both .75s; }
.hero-right   { animation: fadeUp 1s  ease both .3s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ── Mobile ── */
@media (max-width: 768px) {
  body { overflow-y: auto; height: auto; cursor: auto; }
  a { cursor: pointer; }
  #cur-dot, #cur-ring { display: none; }
  .hero { height: auto; min-height: 100vh; grid-template-columns: 1fr; padding: 3rem 1.5rem 2rem; gap: 2.5rem; }
  #globe-wrap { width: 80vw; height: 80vw; }
  footer { height: auto; padding: 1.5rem; }
}
</style>
</head>
<body>

    <line x1="42" y1="10" x2="26" y2="19" stroke="#C8A97E" stroke-width="1.2" stroke-opacity="0.7"/>

    <ellipse id="p2" cx="42" cy="10" rx="8" ry="1.5" fill="#C8A97E" fill-opacity="0.25" stroke="#C8A97E" stroke-width="0.5" stroke-opacity="0.5"/>
    <ellipse id="p3" cx="10" cy="28" rx="8" ry="1.5" fill="#C8A97E" fill-opacity="0.25" stroke="#C8A97E" stroke-width="0.5" stroke-opacity="0.5"/>
    <ellipse id="p4" cx="42" cy="28" rx="8" ry="1.5" fill="#C8A97E" fill-opacity="0.25" stroke="#C8A97E" stroke-width="0.5" stroke-opacity="0.5"/>
    <rect x="21" y="15" width="10" height="8" rx="2" fill="#1a1a1a" stroke="#C8A97E" stroke-width="0.8" stroke-opacity="0.7"/>
    <circle cx="26" cy="30" r="2" fill="#1a1a1a" stroke="#C8A97E" stroke-width="0.7" stroke-opacity="0.5"/>

<script>
'use strict';

/* ════════════════════════════════════
   STARFIELD
   ════════════════════════════════════ */
(function () {
  var cv = document.getElementById('stars');
  var ctx = cv.getContext('2d');
  var stars = [];
  var N = 90;

  function resize() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (var i = 0; i < N; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: 0.4 + Math.random() * 0.9,
      phase: Math.random() * Math.PI * 2,
      speed: 0.0004 + Math.random() * 0.0008
    });
  }

  function tick(ts) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var i = 0; i < N; i++) {
      var s = stars[i];
      var tw = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(ts * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x * cv.width, s.y * cv.height, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,169,126,' + tw.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ════════════════════════════════════
   GLOBE — dual-axis projection
   ════════════════════════════════════ */
var svgEl  = document.getElementById('globe');
var NS     = 'http://www.w3.org/2000/svg';
var CX = 250, CY = 250, R = 210;
var TILT_Y = 10 * Math.PI / 180;
var TILT_X = -35 * Math.PI / 180;
var rotOffset = 20;

/* Cities — HOME first (index 0 = route origin) */
var HOME = { name: 'Como', lat: 45.81, lon: 9.09, url: 'https://www.gioriva.it/mondo/' };
var cities = [
  HOME,
  { name: 'Los Angeles',  lat:  34.05, lon: -118.24, url: 'https://www.gioriva.it/mondo/' },
  { name: 'Tokyo',        lat:  35.70, lon:  139.70, url: 'https://www.gioriva.it/mondo/' },
  { name: 'Hong Kong',    lat:  22.32, lon:  114.17, url: 'https://www.gioriva.it/mondo/' },
  { name: 'New York',     lat:  40.71, lon:  -74.01, url: 'https://www.gioriva.it/mondo/' },
  { name: 'Singapore',    lat:   1.35, lon:  103.82, url: 'https://www.gioriva.it/mondo/' },
  { name: 'Cancun',       lat:  21.16, lon:  -86.85, url: 'https://www.gioriva.it/mondo/' },
  { name: 'Bora Bora',    lat: -16.50, lon: -151.74, url: 'https://www.gioriva.it/mondo/' },
  { name: 'Buenos Aires', lat: -34.61, lon:  -58.38, url: 'https://www.gioriva.it/mondo/' }
];

function project(lat, lon) {
  var phi = (90 - lat) * Math.PI / 180;
  var lam = (lon + rotOffset) * Math.PI / 180;
  var x0 = R * Math.sin(phi) * Math.cos(lam);
  var y0 = R * Math.sin(phi) * Math.sin(lam);
  var z0 = R * Math.cos(phi);
  var x1 = x0 * Math.cos(TILT_Y) - y0 * Math.sin(TILT_Y);
  var y1 = x0 * Math.sin(TILT_Y) + y0 * Math.cos(TILT_Y);
  var z1 = z0;
  var y2 = y1 * Math.cos(TILT_X) - z1 * Math.sin(TILT_X);
  var z2 = y1 * Math.sin(TILT_X) + z1 * Math.cos(TILT_X);
  return { x: CX + x1, y: CY - y2, z: z2 };
}

/* Great-circle interpolation between two lat/lon points */
function gcPoint(a, b, t) {
  var f1 = a.lat * Math.PI / 180, l1 = a.lon * Math.PI / 180;
  var f2 = b.lat * Math.PI / 180, l2 = b.lon * Math.PI / 180;
  var v1 = [Math.cos(f1) * Math.cos(l1), Math.cos(f1) * Math.sin(l1), Math.sin(f1)];
  var v2 = [Math.cos(f2) * Math.cos(l2), Math.cos(f2) * Math.sin(l2), Math.sin(f2)];
  var dot = v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2];
  dot = Math.max(-1, Math.min(1, dot));
  var om = Math.acos(dot);
  if (om < 1e-6) return { lat: a.lat, lon: a.lon };
  var sA = Math.sin((1 - t) * om) / Math.sin(om);
  var sB = Math.sin(t * om) / Math.sin(om);
  var x = sA * v1[0] + sB * v2[0];
  var y = sA * v1[1] + sB * v2[1];
  var z = sA * v1[2] + sB * v2[2];
  return { lat: Math.asin(z) * 180 / Math.PI, lon: Math.atan2(y, x) * 180 / Math.PI };
}

/* Static SVG scaffolding */
var defs = document.createElementNS(NS, 'defs');
defs.innerHTML =
  '<radialGradient id="sg" cx="38%" cy="35%" r="65%">' +
    '<stop offset="0%" stop-color="#2a2520"/>' +
    '<stop offset="100%" stop-color="#0a0a0a"/>' +
  '</radialGradient>' +
  '<clipPath id="gc"><circle cx="250" cy="250" r="210"/></clipPath>';
svgEl.appendChild(defs);

var sphere = document.createElementNS(NS, 'circle');
sphere.setAttribute('cx', CX); sphere.setAttribute('cy', CY); sphere.setAttribute('r', R);
sphere.setAttribute('fill', 'url(#sg)');
svgEl.appendChild(sphere);

var gratG = document.createElementNS(NS, 'g');
gratG.setAttribute('clip-path', 'url(#gc)');
svgEl.appendChild(gratG);

var routeG = document.createElementNS(NS, 'g');
routeG.setAttribute('clip-path', 'url(#gc)');
svgEl.appendChild(routeG);

var dotsG = document.createElementNS(NS, 'g');
dotsG.setAttribute('clip-path', 'url(#gc)');
svgEl.appendChild(dotsG);

var rim = document.createElementNS(NS, 'circle');
rim.setAttribute('cx', CX); rim.setAttribute('cy', CY); rim.setAttribute('r', R);
rim.setAttribute('stroke', 'rgba(200,169,126,0.28)');
rim.setAttribute('stroke-width', '1'); rim.setAttribute('fill', 'none');
svgEl.appendChild(rim);

var tickG = document.createElementNS(NS, 'g');
for (var ta = 0; ta < 360; ta += 10) {
  var rad = ta * Math.PI / 180;
  var r2 = R + (ta % 30 === 0 ? 9 : 5);
  var tick = document.createElementNS(NS, 'line');
  tick.setAttribute('x1', (CX + R  * Math.cos(rad)).toFixed(1));
  tick.setAttribute('y1', (CY + R  * Math.sin(rad)).toFixed(1));
  tick.setAttribute('x2', (CX + r2 * Math.cos(rad)).toFixed(1));
  tick.setAttribute('y2', (CY + r2 * Math.sin(rad)).toFixed(1));
  tick.setAttribute('stroke', ta % 30 === 0 ? 'rgba(200,169,126,0.45)' : 'rgba(255,255,255,0.1)');
  tick.setAttribute('stroke-width', '1');
  tickG.appendChild(tick);
}
svgEl.appendChild(tickG);

/* City links — created once */
var overlay = document.getElementById('city-overlay');
var cityLinks = [];
cities.forEach(function (c, i) {
  var a = document.createElement('a');
  a.href = c.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.cssText = 'position:absolute;pointer-events:auto;display:flex;align-items:center;text-decoration:none;white-space:nowrap;transform:translateY(-50%);visibility:hidden';
  var lbl = document.createElement('span');
  lbl.style.cssText = 'font-family:Montserrat,sans-serif;font-size:8px;font-weight:400;letter-spacing:2px;color:#C8A97E;opacity:0.85;text-transform:uppercase;transition:color .2s,opacity .2s';
  lbl.textContent = c.name.toUpperCase();
  a.appendChild(lbl);
  a.addEventListener('mouseenter', function () {
    document.body.classList.add('hov');
    lbl.style.opacity = '1'; lbl.style.color = '#fff';
  });
  a.addEventListener('mouseleave', function () {
    document.body.classList.remove('hov');
    lbl.style.opacity = '0.85'; lbl.style.color = '#C8A97E';
  });
  overlay.appendChild(a);
  cityLinks.push(a);
});

var wrapEl = document.getElementById('globe-wrap');
var scaleX = 1, scaleY = 1;
function updateScale() {
  var rect = svgEl.getBoundingClientRect();
  scaleX = (rect.width  || 500) / 500;
  scaleY = (rect.height || 500) / 500;
}
updateScale();
window.addEventListener('resize', updateScale);

/* Route dash animation phase */
var dashPhase = 0;

function drawGlobe() {
  gratG.innerHTML = '';
  routeG.innerHTML = '';
  dotsG.innerHTML = '';

  var lat, lon, p, d, pen, path;

  /* Parallels */
  for (lat = -75; lat <= 75; lat += 15) {
    d = ''; pen = false;
    for (lon = -180; lon <= 181; lon += 3) {
      p = project(lat, lon);
      if (p.z > -20) { d += (pen ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1); pen = true; }
      else pen = false;
    }
    if (d.length > 4) {
      path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', lat === 0 ? 'rgba(200,169,126,0.4)' : 'rgba(255,255,255,0.06)');
      path.setAttribute('stroke-width', lat === 0 ? '1' : '0.5');
      path.setAttribute('fill', 'none');
      gratG.appendChild(path);
    }
  }

  /* Meridians */
  for (lon = -180; lon < 180; lon += 15) {
    d = ''; pen = false;
    for (lat = -90; lat <= 90; lat += 3) {
      p = project(lat, lon);
      if (p.z > -20) { d += (pen ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1); pen = true; }
      else pen = false;
    }
    if (d.length > 4) {
      path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', lon === 0 ? 'rgba(200,169,126,0.4)' : 'rgba(255,255,255,0.06)');
      path.setAttribute('stroke-width', lon === 0 ? '1' : '0.5');
      path.setAttribute('fill', 'none');
      gratG.appendChild(path);
    }
  }

  /* Flight routes: HOME -> each destination, great-circle arcs */
  for (var ci = 1; ci < cities.length; ci++) {
    d = ''; pen = false;
    for (var t = 0; t <= 1.001; t += 0.04) {
      var g = gcPoint(HOME, cities[ci], Math.min(t, 1));
      p = project(g.lat, g.lon);
      if (p.z > -10) { d += (pen ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1); pen = true; }
      else pen = false;
    }
    if (d.length > 4) {
      path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', 'rgba(200,169,126,0.30)');
      path.setAttribute('stroke-width', '0.7');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-dasharray', '3 5');
      path.setAttribute('stroke-dashoffset', String(-dashPhase));
      routeG.appendChild(path);
    }
  }

  /* Cities */
  for (var i = 0; i < cities.length; i++) {
    var c = cities[i];
    p = project(c.lat, c.lon);
    var visible = p.z > -60;

    var cdot = document.createElementNS(NS, 'circle');
    cdot.setAttribute('cx', p.x.toFixed(1)); cdot.setAttribute('cy', p.y.toFixed(1));
    cdot.setAttribute('r', i === 0 ? '3' : '2.5');
    cdot.setAttribute('fill', '#C8A97E');
    cdot.setAttribute('opacity', visible ? '0.9' : '0');
    dotsG.appendChild(cdot);

    var cring = document.createElementNS(NS, 'circle');
    cring.setAttribute('cx', p.x.toFixed(1)); cring.setAttribute('cy', p.y.toFixed(1));
    cring.setAttribute('r', '5.5'); cring.setAttribute('fill', 'none');
    cring.setAttribute('stroke', '#C8A97E'); cring.setAttribute('stroke-width', '0.6');
    cring.setAttribute('opacity', visible ? '0.3' : '0');
    dotsG.appendChild(cring);

    var a = cityLinks[i];
    if (!visible) {
      a.style.visibility = 'hidden';
    } else {
      a.style.visibility = 'visible';
      a.style.left = ((p.x + 10) * scaleX) + 'px';
      a.style.top  = (p.y * scaleY) + 'px';
    }
  }

  rotOffset += 0.10;
  dashPhase += 0.15;
  requestAnimationFrame(drawGlobe);
}
drawGlobe();

/* ════════════════════════════════════
   PARALLAX on globe
   ════════════════════════════════════ */
(function () {
  var px = 0, py = 0, tx = 0, ty = 0;
  document.addEventListener('mousemove', function (e) {
    tx = (e.clientX / window.innerWidth  - 0.5) * 14;
    ty = (e.clientY / window.innerHeight - 0.5) * 14;
  });
  function lerp() {
    px += (tx - px) * 0.04;
    py += (ty - py) * 0.04;
    wrapEl.style.transform = 'translate(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px)';
    requestAnimationFrame(lerp);
  }
  lerp();
})();

/* ════════════════════════════════════
   CUSTOM CURSOR
   ════════════════════════════════════ */
(function () {
  var dot = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  var mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', function (e) {
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + 'px'; dot.style.top = my + 'px';
  });
  (function anim() {
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(anim);
  })();
  document.querySelectorAll('a, #drone').forEach(function (el) {
    el.addEventListener('mouseenter', function () { document.body.classList.add('hov'); });
    el.addEventListener('mouseleave', function () { document.body.classList.remove('hov'); });
  });
})();

/* ════════════════════════════════════
   DRONE flight
   ════════════════════════════════════ */
(function () {
  var drone = document.getElementById('drone');
  var W = window.innerWidth, H = window.innerHeight;
  window.addEventListener('resize', function () { W = window.innerWidth; H = window.innerHeight; });

  var waypoints = [
    [0.15, 0.20], [0.35, 0.12], [0.55, 0.22], [0.70, 0.10],
    [0.85, 0.18], [0.78, 0.35], [0.60, 0.45], [0.75, 0.60],
    [0.55, 0.72], [0.38, 0.65], [0.20, 0.75], [0.10, 0.55],
    [0.22, 0.38], [0.08, 0.28]
  ];

  var idx = 0;
  var startX = -60, startY = H * 0.2;
  var targetX = waypoints[0][0] * W, targetY = waypoints[0][1] * H;
  var startTime = null;
  var segDuration = 7000;
  var propAngle = 0;

  setTimeout(function () { drone.classList.add('visible'); }, 800);

  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

  function anim(ts) {
    if (!startTime) startTime = ts;
    var t = Math.min((ts - startTime) / segDuration, 1);
    var e = easeInOut(t);
    var x = startX + (targetX - startX) * e;
    var y = startY + (targetY - startY) * e;
    var hover = Math.sin(ts * 0.0015) * 3;
    var tilt = Math.max(-12, Math.min(12, (targetX - startX) * 0.015));

    drone.style.left = (x - 26) + 'px';
    drone.style.top  = (y - 19 + hover) + 'px';
    drone.style.transform = 'rotate(' + tilt + 'deg)';

    propAngle += 18;
    ['p1','p2','p3','p4'].forEach(function (id, i) {
      var el = document.getElementById(id);
      var phase = (propAngle + i * 45) % 180;
      el.setAttribute('transform', 'rotate(' + phase + ' ' + el.getAttribute('cx') + ' ' + el.getAttribute('cy') + ')');
    });

    if (t >= 1) {
      startX = x; startY = y + hover;
      idx = (idx + 1) % waypoints.length;
      targetX = waypoints[idx][0] * W;
      targetY = waypoints[idx][1] * H;
      startTime = ts;
      segDuration = 5500 + Math.random() * 4000;
    }
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
})();
</script>
