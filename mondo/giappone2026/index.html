  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #080808;
      color: #f0ece4;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #8B0000; border-radius: 2px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .fade-up { animation: fadeUp 0.4s ease both; }

    .btn {
      padding: 0.45rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.75);
    }
    .btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .btn.active { background: #FFD700; color: #000; border-color: #FFD700; font-weight: 600; }

    .card {
      border-radius: 0.85rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      transition: border-color 0.2s, background 0.2s;
    }
    .card:hover { border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); }

    .gold-text {
      background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    /* ── MOBILE: day horizontal scroll ── */
    .day-scroll {
      display: flex;
      overflow-x: auto;
      gap: 0.5rem;
      padding: 1rem 1rem 0.6rem;
      scrollbar-width: none;
    }
    .day-scroll::-webkit-scrollbar { display: none; }

    .day-btn-mobile {
      flex-shrink: 0;
      min-width: 66px;
      padding: 0.55rem 0.7rem;
      border-radius: 0.6rem;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.55);
    }
    .day-btn-mobile:hover { background: rgba(255,255,255,0.09); color: #fff; }
    .day-btn-mobile.active { color: #fff; }

    /* ── DESKTOP LAYOUT ── */
    .page-wrapper { max-width: 1280px; margin: 0 auto; }

    .desktop-body { display: block; }
    .desktop-sidebar { display: none; }
    .desktop-main { width: 100%; }
    .activities-grid { display: flex; flex-direction: column; gap: 0.7rem; }
    .transport-grid { display: flex; flex-direction: column; gap: 0.8rem; }
    .budget-grid { display: flex; flex-direction: column; gap: 1.2rem; }
    .bottom-row { display: flex; flex-direction: column; gap: 0.8rem; }

    @media (min-width: 960px) {
      .day-scroll { display: none; }

      .desktop-body {
        display: flex;
        align-items: flex-start;
        gap: 0;
        min-height: calc(100vh - 160px);
      }

      .desktop-sidebar {
        display: flex;
        flex-direction: column;
        width: 200px;
        flex-shrink: 0;
        padding: 1.5rem 0.8rem 1.5rem 1.2rem;
        position: sticky;
        top: 0;
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        scrollbar-width: none;
        gap: 0.35rem;
        border-right: 1px solid rgba(255,255,255,0.06);
      }
      .desktop-sidebar::-webkit-scrollbar { display: none; }

      .sidebar-label {
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        color: rgba(240,236,228,0.3);
        text-transform: uppercase;
        padding: 0 0.4rem 0.5rem;
      }

      .sidebar-day-btn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.55rem 0.7rem;
        border-radius: 0.6rem;
        cursor: pointer;
        font-family: 'Plus Jakarta Sans', sans-serif;
        text-align: left;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255,255,255,0.5);
        width: 100%;
      }
      .sidebar-day-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
      .sidebar-day-btn.active { color: #fff; border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); }

      .desktop-main {
        flex: 1;
        padding: 1.5rem 2rem 2rem;
        min-width: 0;
      }

      .activities-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }

      .transport-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }

      .budget-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        align-items: start;
      }

      .bottom-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
        margin-top: 0.8rem;
      }
    }
  </style>
</head>

                          <span style={{ fontSize: "0.92rem", color: "#fff", fontWeight: 600 }}>{b.item}</span>
                          <span style={{ padding: "0.2rem 0.65rem", borderRadius: "1rem", fontSize: "0.6rem", background: `${statusColor}22`, color: statusColor, border: `1px solid ${statusColor}55`, flexShrink: 0, fontWeight: 600, letterSpacing: "0.05em" }}>{statusLabel}</span>
                        </div>
                        <div style={{ fontSize: "0.78rem", color: "rgba(240,236,228,0.68)", lineHeight: 1.55 }}>{b.note}</div>
                      </div>
                    );
                  })}
                </div>

                <div style={{ marginTop: "1.2rem", padding: "1rem 1.2rem", borderRadius: "0.85rem", background: "rgba(46,204,113,0.08)", border: "1px solid rgba(46,204,113,0.25)" }}>
                  <div style={{ fontSize: "0.68rem", color: "#2ECC71", letterSpacing: "0.15em", marginBottom: "0.4rem", textTransform: "uppercase" }}>✓ Già a posto</div>
                  <div style={{ fontSize: "0.8rem", color: "rgba(240,236,228,0.75)", lineHeight: 1.6 }}>
                    Tutti gli hotel (Tokyo, Kyoto, Osaka, Hakone) sono prenotati e pagati. I biglietti teamLab Planets sono acquistati per il 5 luglio ore 15:00. Le priorità rimanenti: JR Pass (urgente, solo online dall'estero), poi Skytree, Shibuya Sky e l'omakase di Ginza.
                  </div>
                </div>
              </div>
            )}

            {/* ── BUDGET TAB ── */}
            {tab === "budget" && (
              <div className="fade-up" style={{ padding: "1.5rem 1rem 2rem" }}>
                <div style={{ fontSize: "0.68rem", color: "rgba(240,236,228,0.4)", letterSpacing: "0.18em", textTransform: "uppercase", marginBottom: "1rem" }}>Stima di spesa per 2 persone · voli esclusi</div>
                <div className="budget-grid">

                  {/* Budget table */}
                  <div>
                    <div style={{ borderRadius: "0.85rem", overflow: "hidden", border: "1px solid rgba(255,255,255,0.07)" }}>
                      {budget.map(([voce, costo], i) => {
                        const isLast = i === budget.length - 1;
                        return (
                          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0.9rem 1.2rem", background: isLast ? "rgba(255,215,0,0.1)" : i % 2 === 0 ? "rgba(255,255,255,0.035)" : "transparent", borderTop: i > 0 ? "1px solid rgba(255,255,255,0.06)" : "none" }}>
                            <span style={{ fontSize: isLast ? "0.9rem" : "0.83rem", color: isLast ? "#FFD700" : "rgba(240,236,228,0.78)", fontWeight: isLast ? 600 : 400 }}>{voce}</span>
                            <span style={{ fontSize: isLast ? "1rem" : "0.88rem", color: isLast ? "#FFD700" : "#fff", fontWeight: isLast ? 600 : 400, fontFamily: "'DM Mono', monospace" }}>{costo}</span>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ marginTop: "0.8rem", padding: "0.9rem 1rem", borderRadius: "0.85rem", background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", fontSize: "0.75rem", color: "rgba(240,236,228,0.48)", lineHeight: 1.6 }}>
                      💴 Cambio indicativo: 1€ ≈ ¥160–165. Il Giappone è tornato a essere una destinazione di medio costo per i turisti europei grazie allo yen debole.
                    </div>
                  </div>

                  {/* Checklist */}
                  <div style={{ padding: "1.2rem 1.3rem", borderRadius: "0.85rem", background: "rgba(192,57,43,0.09)", border: "1px solid rgba(192,57,43,0.22)" }}>
                    <div style={{ fontSize: "0.68rem", color: "#C0392B", marginBottom: "1rem", letterSpacing: "0.15em", textTransform: "uppercase" }}>📋 Da prenotare prima di partire</div>
                    {checklist.map(([item, note], i) => (
                      <div key={i} style={{ display: "flex", gap: "0.6rem", padding: "0.55rem 0", borderBottom: i < checklist.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none", fontSize: "0.82rem" }}>
                        <span style={{ color: "#C0392B", flexShrink: 0, marginTop: "0.1rem" }}>✓</span>
                        <div>
                          <div style={{ color: "#fff", fontWeight: 500 }}>{item}</div>
                          <div style={{ color: "rgba(240,236,228,0.45)", fontSize: "0.74rem", marginTop: "0.15rem" }}>{note}</div>
                        </div>
                      </div>
                    ))}
                  </div>

                </div>
              </div>
            )}

          </div>{/* end page-wrapper */}

          {/* ── FOOTER ── */}
          <div style={{ padding: "2rem 1.5rem", textAlign: "center", fontSize: "0.72rem", color: "rgba(240,236,228,0.25)", letterSpacing: "0.12em", borderTop: "1px solid rgba(255,255,255,0.05)", marginTop: "1rem" }}>
            良い旅を · Buon viaggio, Giorgio & Lucrezia 🎌
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
