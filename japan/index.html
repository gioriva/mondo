  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #080808;
      color: #f0ece4;
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #8B0000; border-radius: 2px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .fade-up { animation: fadeUp 0.4s ease both; }

    .btn {
      padding: 0.45rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.75);
    }
    .btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .btn.active { background: #FFD700; color: #000; border-color: #FFD700; font-weight: 600; }

    .card {
      border-radius: 0.85rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      transition: border-color 0.2s, background 0.2s;
    }
    .card:hover { border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); }

    .gold-text {
      background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    /* ── MOBILE: day horizontal scroll ── */
    .day-scroll {
      display: flex;
      overflow-x: auto;
      gap: 0.5rem;
      padding: 1rem 1rem 0.6rem;
      scrollbar-width: none;
    }
    .day-scroll::-webkit-scrollbar { display: none; }

    .day-btn-mobile {
      flex-shrink: 0;
      min-width: 66px;
      padding: 0.55rem 0.7rem;
      border-radius: 0.6rem;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      text-align: center;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.55);
    }
    .day-btn-mobile:hover { background: rgba(255,255,255,0.09); color: #fff; }
    .day-btn-mobile.active { color: #fff; }

    /* ── DESKTOP LAYOUT ── */
    .page-wrapper { max-width: 1280px; margin: 0 auto; }

    .desktop-body { display: block; }
    .desktop-sidebar { display: none; }
    .desktop-main { width: 100%; }
    .activities-grid { display: flex; flex-direction: column; gap: 0.7rem; }
    .transport-grid { display: flex; flex-direction: column; gap: 0.8rem; }
    .budget-grid { display: flex; flex-direction: column; gap: 1.2rem; }
    .bottom-row { display: flex; flex-direction: column; gap: 0.8rem; }

    @media (min-width: 960px) {
      .day-scroll { display: none; }

      .desktop-body {
        display: flex;
        align-items: flex-start;
        gap: 0;
        min-height: calc(100vh - 160px);
      }

      .desktop-sidebar {
        display: flex;
        flex-direction: column;
        width: 200px;
        flex-shrink: 0;
        padding: 1.5rem 0.8rem 1.5rem 1.2rem;
        position: sticky;
        top: 0;
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        scrollbar-width: none;
        gap: 0.35rem;
        border-right: 1px solid rgba(255,255,255,0.06);
      }
      .desktop-sidebar::-webkit-scrollbar { display: none; }

      .sidebar-label {
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        color: rgba(240,236,228,0.3);
        text-transform: uppercase;
        padding: 0 0.4rem 0.5rem;
      }

      .sidebar-day-btn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.55rem 0.7rem;
        border-radius: 0.6rem;
        cursor: pointer;
        font-family: 'Cormorant Garamond', serif;
        text-align: left;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255,255,255,0.5);
        width: 100%;
      }
      .sidebar-day-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
      .sidebar-day-btn.active { color: #fff; border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); }

      .desktop-main {
        flex: 1;
        padding: 1.5rem 2rem 2rem;
        min-width: 0;
      }

      .activities-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }

      .transport-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }

      .budget-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        align-items: start;
      }

      .bottom-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
        margin-top: 0.8rem;
      }
    }
  </style>
</head>
